name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Unit-Tests
        run: |
          python -m unittest discover -s fuekw -v
          python -m unittest discover -s iuk-services/volumen -v
      - name: ShellCheck
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck $files; else echo "keine Shell-Skripte"; fi
